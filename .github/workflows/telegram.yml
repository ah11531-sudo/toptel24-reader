# Reads the wholesalers' Telegram channels and sends new posts to the site.
# Telegram is filtered in Iran, so this runs on GitHub's servers (free minutes) instead of the
# Iranian host. Runs every 10 minutes in the daytime and always reads the channels (a public
# repo, so Actions minutes are free).
# Needs two repository secrets: APP_URL (the site address) and FETCHER_TOKEN (same as on the site).
name: Telegram channels

on:
  schedule:
    - cron: "*/10 4-16 * * *"      # every 10 minutes from 07:30 to 20:30 Tehran time
  workflow_dispatch:                # "Run workflow" button: check now

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read channels
        env:
          APP_URL: ${{ secrets.APP_URL }}
          FETCHER_TOKEN: ${{ secrets.FETCHER_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$FETCHER_TOKEN" ]; then echo "APP_URL / FETCHER_TOKEN not set yet"; exit 0; fi
          python telegram_fetch.py --force   # every run reads the channels; the site's check times are not used
